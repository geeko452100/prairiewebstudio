# Netlify form detection for static HTML (no build step required)
[[redirects]]
  from = "/?success=true"
  to = "/index.html?success=true"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
