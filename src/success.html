<body class="bg-ink-50 font-sans text-ink-800 antialiased">
  <a href="#main" class="sr-only focus-visible:absolute focus-visible:left-4 focus-visible:top-4 focus-visible:z-50 focus-visible:m-0 focus-visible:block focus-visible:h-auto focus-visible:w-auto focus-visible:overflow-visible focus-visible:whitespace-normal focus-visible:rounded-lg focus-visible:bg-brand-800 focus-visible:px-4 focus-visible:py-2 focus-visible:text-sm focus-visible:font-medium focus-visible:text-white">
    Skip to main content
  </a>

  <div class="flex min-h-screen flex-col">
    <header class="border-b border-ink-100/80 bg-white">
      <div class="container-site flex h-16 items-center justify-center px-4 sm:px-6 lg:px-8">
        <a href="./" class="flex items-center gap-3 rounded-lg focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-500" aria-label="Snap Load Digital — Home">

          <span class="text-lg font-bold tracking-tight text-ink-900">Snap Load <span class="text-brand-800">Digital</span></span>
        </a>
      </div>
    </header>

    <main id="main" class="flex flex-1 items-center justify-center px-4 py-16 sm:px-6 lg:px-8">
      <div class="w-full max-w-lg text-center">
        <div class="mx-auto mb-8 flex h-16 w-16 items-center justify-center rounded-full bg-brand-50 ring-1 ring-brand-200" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-brand-800">
            <path d="M20 6 9 17l-5-5"/>
          </svg>
        </div>

        <h1 id="success-heading" class="text-3xl font-extrabold tracking-tight text-ink-950 sm:text-4xl">
          Thank you for your business!
        </h1>

        <p class="mt-4 text-lg leading-relaxed text-ink-600">
          Your payment was received successfully. We appreciate your trust and look forward to working with you.
        </p>

        <div class="mt-10 flex flex-col items-center gap-3 sm:flex-row sm:justify-center">
          <a href="./" class="btn-primary w-full sm:w-auto">Return to Home</a>
          <a href="mailto:ggriffith@snapload-digital.com" class="btn-secondary w-full sm:w-auto">Contact Us</a>
        </div>
      </div>
    </main>

    <footer class="border-t border-ink-100 bg-white py-6">
      <p class="text-center text-sm text-ink-500">
        &copy; <span id="year"></span> Snap Load Digital. All rights reserved.
      </p>
    </footer>
  </div>

  <script>
    (function () {
      var heading = document.getElementById('success-heading');
      var defaultMessage = 'Thank you for your business!';
      var params = new URLSearchParams(window.location.search);
      var name = params.get('name');

      if (name && heading) {
        var firstName = name.trim().split(/\s+/)[0];
        if (firstName) {
          heading.textContent = 'Thank you, ' + firstName + '!';
        } else {
          heading.textContent = defaultMessage;
        }
      } else if (heading) {
        heading.textContent = defaultMessage;
      }

      var yearEl = document.getElementById('year');
      if (yearEl) {
        yearEl.textContent = new Date().getFullYear();
      }
    })();
  </script>
