<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280" role="img" aria-labelledby="map-title">
  <title id="map-title">Map showing Great Bend, Kansas area</title>
  <defs>
    <linearGradient id="map-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <filter id="pin-shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="600" height="280" fill="url(#map-bg)" rx="12"/>
  <!-- Roads -->
  <path d="M0 140h600M300 0v280" stroke="#cbd5e1" stroke-width="8" fill="none"/>
  <path d="M0 70h600M0 210h600" stroke="#e2e8f0" stroke-width="4" fill="none"/>
  <path d="M100 0v280M500 0v280" stroke="#e2e8f0" stroke-width="4" fill="none"/>
  <!-- Parks -->
  <rect x="380" y="40" width="100" height="70" rx="8" fill="#bbf7d0" opacity="0.6"/>
  <rect x="80" y="160" width="120" height="80" rx="8" fill="#bbf7d0" opacity="0.5"/>
  <!-- River -->
  <path d="M0 200 Q150 180 300 195 T600 185" stroke="#7dd3fc" stroke-width="12" fill="none" opacity="0.5"/>
  <!-- Location pin -->
  <g filter="url(#pin-shadow)" transform="translate(300 130)">
    <path fill="#0891b2" d="M0-36c-14 0-26 12-26 26 0 20 26 52 26 52s26-32 26-52c0-14-12-26-26-26zm0 36c-5.5 0-10-4.5-10-10s4.5-10 10-10 10 4.5 10 10-4.5 10-10 10z"/>
    <circle cx="0" cy="-10" r="6" fill="#fff"/>
  </g>
  <!-- Label -->
  <rect x="220" y="200" width="160" height="36" rx="8" fill="#fff" opacity="0.9"/>
  <text x="300" y="223" text-anchor="middle" fill="#0f172a" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Great Bend, KS 67530</text>
</svg>
