<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-labelledby="hero-title">
  <title id="hero-title">Modern website design illustration</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="640" height="480" fill="url(#sky)" rx="24"/>

  <!-- Decorative orbs -->
  <circle cx="520" cy="80" r="56" fill="#06b6d4" opacity="0.12" filter="url(#soft)"/>
  <circle cx="100" cy="380" r="72" fill="#f59e0b" opacity="0.1" filter="url(#soft)"/>
  <circle cx="560" cy="360" r="40" fill="#22d3ee" opacity="0.15"/>

  <!-- Grid dots -->
  <g fill="#94a3b8" opacity="0.25">
    <circle cx="60" cy="60" r="2"/><circle cx="90" cy="60" r="2"/><circle cx="120" cy="60" r="2"/>
    <circle cx="60" cy="90" r="2"/><circle cx="90" cy="90" r="2"/><circle cx="120" cy="90" r="2"/>
    <circle cx="500" cy="400" r="2"/><circle cx="530" cy="400" r="2"/><circle cx="560" cy="400" r="2"/>
    <circle cx="500" cy="430" r="2"/><circle cx="530" cy="430" r="2"/><circle cx="560" cy="430" r="2"/>
  </g>

  <!-- Main browser window -->
  <g filter="url(#shadow)" transform="translate(120 60)">
    <rect width="400" height="300" rx="16" fill="#fff"/>
    <rect width="400" height="44" rx="16" fill="#f1f5f9"/>
    <rect y="28" width="400" height="16" fill="#fff"/>
    <circle cx="24" cy="22" r="6" fill="#f87171"/>
    <circle cx="44" cy="22" r="6" fill="#fbbf24"/>
    <circle cx="64" cy="22" r="6" fill="#4ade80"/>
    <rect x="100" y="14" width="200" height="16" rx="8" fill="#e2e8f0"/>

    <!-- Screen content -->
    <rect x="24" y="64" width="352" height="200" rx="8" fill="url(#screen)"/>
    <rect x="40" y="80" width="120" height="12" rx="4" fill="url(#accent)"/>
    <rect x="40" y="104" width="200" height="8" rx="3" fill="#334155"/>
    <rect x="40" y="120" width="160" height="8" rx="3" fill="#334155"/>
    <rect x="40" y="152" width="88" height="32" rx="8" fill="url(#accent)"/>
    <rect x="140" y="152" width="88" height="32" rx="8" fill="#334155"/>

    <!-- Chart bars -->
    <g transform="translate(280 140)">
      <rect x="0" y="48" width="20" height="40" rx="4" fill="#06b6d4" opacity="0.7"/>
      <rect x="28" y="24" width="20" height="64" rx="4" fill="#22d3ee"/>
      <rect x="56" y="36" width="20" height="52" rx="4" fill="#0891b2" opacity="0.8"/>
    </g>

    <!-- Image placeholder -->
    <rect x="40" y="200" width="140" height="48" rx="8" fill="#1e293b"/>
    <rect x="48" y="208" width="60" height="8" rx="2" fill="#475569"/>
    <rect x="48" y="222" width="100" height="6" rx="2" fill="#334155"/>
    <rect x="48" y="234" width="80" height="6" rx="2" fill="#334155"/>

    <!-- Speed gauge -->
    <g transform="translate(300 200)">
      <circle cx="40" cy="24" r="28" fill="none" stroke="#334155" stroke-width="6"/>
      <path d="M 12 24 A 28 28 0 0 1 68 24" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
      <text x="40" y="30" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="14" font-weight="700">100</text>
    </g>
  </g>

  <!-- Floating phone -->
  <g filter="url(#shadow)" transform="translate(48 200)">
    <rect width="96" height="168" rx="16" fill="#0f172a"/>
    <rect x="8" y="24" width="80" height="120" rx="6" fill="#1e293b"/>
    <rect x="16" y="36" width="48" height="6" rx="2" fill="url(#accent)"/>
    <rect x="16" y="50" width="64" height="4" rx="2" fill="#475569"/>
    <rect x="16" y="60" width="56" height="4" rx="2" fill="#475569"/>
    <rect x="16" y="80" width="64" height="28" rx="6" fill="#334155"/>
    <rect x="36" y="8" width="24" height="4" rx="2" fill="#334155"/>
    <circle cx="48" cy="156" r="8" fill="#334155"/>
  </g>

  <!-- Rocket accent -->
  <g transform="translate(500 120)">
    <circle cx="40" cy="40" r="36" fill="url(#warm)" opacity="0.2"/>
    <path fill="url(#warm)" d="M40 8c-8 12-12 28-12 40 0 4 8 16 12 16s12-12 12-16c0-12-4-28-12-40zm0 52c-6.6 0-12 5.4-12 12v8h24v-8c0-6.6-5.4-12-12-12z"/>
    <path fill="#fff" opacity="0.9" d="M36 36l4-12 4 12-4-2z"/>
  </g>

  <!-- Connection lines -->
  <path d="M144 280 Q200 320 260 300" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6 4" opacity="0.5"/>
  <path d="M460 200 Q420 260 380 280" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" opacity="0.4"/>
</svg>
